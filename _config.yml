# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: "Szołkowski's Blog"
email: stanislaw.szolkowski@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Blog about Optimizely CMS development, .NET, and technical content
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://szolkowski.github.io"
lang: en-US
logo: /assets/img/og-default.png
image: /assets/img/og-default.png
github_username:  "Szolkowski"
google_analytics: "G-TD33G35VRK"
credly_badge_id: "9a2bcbc0-5caf-40b7-9f6c-b007b052ddd6"
disqus_username: "szolkowski"

author:
  name: Stanisław Szołkowski
  email: stanislaw.szolkowski@gmail.com
  url: https://szolkowski.github.io/about/

# Single source of truth for the author's social/professional profiles.
# Iterated by _includes/_footer.html, _includes/head-custom.html (Person sameAs on /about), and /llms.txt.
social_profiles:
  - name: LinkedIn
    url: https://www.linkedin.com/in/stanis%C5%82aw-szo%C5%82kowski-554a60164/
  - name: GitHub
    url: https://github.com/szolkowski
  - name: Optimizely World
    url: https://world.optimizely.com/System/Users-and-profiles/Community-Profile-Card/?userId=7329f76b-c577-49d5-aa09-c8aff3c0610d

# jekyll-seo-tag reads site.social.links as a flat array of URL strings (used for
# Person sameAs in the homepage WebSite JSON-LD). Keep these in sync with social_profiles above.
social:
  name: Stanisław Szołkowski
  links:
    - https://www.linkedin.com/in/stanis%C5%82aw-szo%C5%82kowski-554a60164/
    - https://github.com/szolkowski
    - https://world.optimizely.com/System/Users-and-profiles/Community-Profile-Card/?userId=7329f76b-c577-49d5-aa09-c8aff3c0610d

# Pretty post URLs. Post canonical URL becomes /YYYY/MM/DD/slug/ (no .html).
# Existing posts carry a redirect_from entry for their old /YYYY/MM/DD/slug.html
# URL so prior inbound links and Search Console results keep resolving.
permalink: /:year/:month/:day/:title/

# Build settings
remote_theme: pages-themes/architect@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-last-modified-at

defaults:
  - scope:
      path: "assets/img"
    values:
      image: true
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Stanisław Szołkowski
      comments: true

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
