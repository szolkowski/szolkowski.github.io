<footer class="site-footer">
    <div class="content-wrapper">
        <div class="inner clearfix">
            <div class="main-content">
                <div class="home">
                    <div class="footer-author">
                        <p>
                            <strong>{{ site.author.name }}</strong> &mdash; Optimizely MVP &amp; .NET engineer.
                            <a href="{{ '/about/' | relative_url }}">More about me &rarr;</a>
                        </p>
                        <p class="footer-social">
                            {% for profile in site.social_profiles %}
                            <a href="{{ profile.url }}" rel="me noopener" target="_blank">{{ profile.name }}</a>{% unless forloop.last %} ·{% endunless %}
                            {% endfor %}
                        </p>
                    </div>
                    <p class="footer-links">
                        <a href="{{ '/archive' | relative_url }}">Read more articles</a> ·
                        <a href="{{ '/tags/' | relative_url }}">Browse by tag</a> ·
                        subscribe <a class="rss-subscribe" href="{{ '/feed.xml' | relative_url }}">via RSS</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</footer>
