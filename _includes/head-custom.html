{% if site.google_analytics %}
{% include head-custom-google-analytics.html %}
{% endif %}

{% unless page.image %}
<meta property="og:image" content="{{ '/assets/img/og-default.png' | absolute_url }}" />
<meta property="og:image:alt" content="{{ site.title | escape }}" />
<meta name="twitter:image" content="{{ '/assets/img/og-default.png' | absolute_url }}" />
{% endunless %}

{% if page.layout == "post" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": "Home", "item": "{{ '/' | absolute_url }}"},
    {"@type": "ListItem", "position": 2, "name": "Archive", "item": "{{ '/archive/' | absolute_url }}"},
    {"@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": "{{ page.url | absolute_url }}"}
  ]
}
</script>
{% elsif page.layout == "tagpage" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": "Home", "item": "{{ '/' | absolute_url }}"},
    {"@type": "ListItem", "position": 2, "name": "Tags", "item": "{{ '/tags/' | absolute_url }}"},
    {"@type": "ListItem", "position": 3, "name": {{ page.tag | jsonify }}, "item": "{{ page.url | absolute_url }}"}
  ]
}
</script>
{% endif %}

{% if page.url == "/about/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Stanisław Szołkowski",
  "url": "{{ site.url }}/about/",
  "jobTitle": "Optimizely MVP / Senior .NET Engineer",
  "knowsAbout": [
    "Optimizely CMS",
    "Optimizely Commerce",
    "Episerver",
    ".NET",
    "C#",
    "ASP.NET Core",
    "Entity Framework Core",
    "Hangfire",
    "SQL Server performance",
    "Background jobs",
    "Scheduled jobs"
  ],
  "sameAs": [
    "https://www.linkedin.com/in/stanis%C5%82aw-szo%C5%82kowski-554a60164/",
    "https://world.optimizely.com/System/Users-and-profiles/Community-Profile-Card/?userId=7329f76b-c577-49d5-aa09-c8aff3c0610d",
    "https://github.com/szolkowski"
  ]
}
</script>
{% endif %}
